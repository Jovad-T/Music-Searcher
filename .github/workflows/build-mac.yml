name: Build Mac App

# 코드가 메인 브랜치에 푸시될 때마다 실행 (또는 원할 때 수동 실행 가능)
on: 
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 코드 가져오기 (Checkout)
      uses: actions/checkout@v4

    - name: Python 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # 사용 중인 파이썬 버전에 맞게 수정하세요

    - name: 필수 라이브러리 및 PyInstaller 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: PyInstaller로 앱 빌드
      run: pyinstaller --windowed --onefile app.py

    - name: 빌드 결과물(Artifact) 업로드
      uses: actions/upload-artifact@v4
      with:
        name: MusicSearcher-Mac
        path: dist/
